name: Release 1 Bullet

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Validate version tag
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw "Tag must be v$version." }
      - name: Install build dependencies
        run: python -m pip install --upgrade pip PyInstaller; python -m pip install -r backend/requirements.txt
      - name: Prepare build venv
        run: python -m venv .venv
      - name: Build source release
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version (Get-Content VERSION -Raw).Trim() -Output dist -AllowDirty
      - name: Build executable
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath $env:TEMP\1bullet-build 1bullet.spec
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          $version = (Get-Content VERSION -Raw).Trim()
          & iscc "/DONEBULLET_VERSION=$version" installer.iss
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "v$version"
          function Invoke-Gh {
            & gh @args
            if ($LASTEXITCODE -ne 0) { throw "gh $($args -join ' ') failed with exit $LASTEXITCODE" }
          }
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $existing) { Invoke-Gh release create $tag --generate-notes --title $tag --draft=false }
          Invoke-Gh release upload $tag --clobber "dist/1bullet.exe" "dist/1 Bullet Setup.exe" "dist/1bullet-v$version.zip"
          # NOTE: GitHub normalizes spaces in asset names to dots on upload,
          # so the installer is listed as 1.Bullet.Setup.exe. The updater
          # matches it with or without spaces.
          Invoke-Gh release edit $tag --draft=false
          $names = (gh release view $tag --json assets -q '.assets[].name') -split "`r?`n" | Where-Object { $_ }
          foreach ($need in @("1bullet.exe", "1.Bullet.Setup.exe", "1bullet-v$version.zip")) {
            if ($names -notcontains $need) { throw "release is missing asset '$need' (have: $($names -join ', '))" }
          }
