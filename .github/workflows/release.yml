name: Release 1 Bullet

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Validate version tag
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw "Tag must be v$version." }
      - name: Install build dependencies
        run: python -m pip install --upgrade pip PyInstaller; python -m pip install -r backend/requirements.txt
      - name: Prepare build venv
        run: python -m venv .venv
      - name: Build source release
        shell: pwsh
        run: ./scripts/build-release.ps1 -Version (Get-Content VERSION -Raw).Trim() -Output dist -AllowDirty
      - name: Build executable
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath $env:TEMP\1bullet-build 1bullet.spec
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          $version = (Get-Content VERSION -Raw).Trim()
          & iscc "/DONEBULLET_VERSION=$version" installer.iss
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "v$version"
          $existing = gh release view $tag --json name 2>$null
          if (-not $existing) { gh release create $tag --generate-notes --title $tag }
          gh release upload $tag --clobber "dist/1bullet.exe" "dist/1 Bullet Setup.exe" "dist/1bullet-v$version.zip"
          $bad = gh release view $tag --json assets -q '.assets[] | select(.name == "1.Bullet.Setup.exe") | .name'
          if ($bad) { gh release delete-asset $tag $bad --yes }
